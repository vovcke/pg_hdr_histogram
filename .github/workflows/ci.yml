name: CI

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          - pg: 14
            port: 5414
          - pg: 15
            port: 5415
          - pg: 16
            port: 5416
          - pg: 17
            port: 5417
          - pg: 18
            port: 5432

    steps:
      - uses: actions/checkout@v4

      - name: Add PostgreSQL APT repository
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates gnupg lsb-release
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --dearmor | sudo tee /usr/share/keyrings/postgresql.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/postgresql.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update

      - name: Install PostgreSQL ${{ matrix.pg }}
        if: runner.environment != 'self-hosted'
        run: |
          sudo apt-get install -y \
            postgresql-${{ matrix.pg }} \
            postgresql-server-dev-${{ matrix.pg }} \
            build-essential \
            zlib1g-dev

      - name: Build
        run: make clean && make
        env:
          PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config

      - name: Install and test
        run: |
          sudo make install PG_CONFIG=/usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          sudo pg_ctlcluster ${{ matrix.pg }} main restart
          sudo -u postgres createuser -p ${{ matrix.port }} -s "$(whoami)" 2>/dev/null || true
          make installcheck
        env:
          PG_CONFIG: /usr/lib/postgresql/${{ matrix.pg }}/bin/pg_config
          PGPORT: ${{ matrix.port }}
